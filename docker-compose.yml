services:
  bot:
    build: .
    init: true
    # Bind-mounted ./data and ./logs are owned by the host user. Override
    # BOT_UID/BOT_GID if that login is not 1000:1000.
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/bookclub.db
      - PERSISTENCE_PATH=/app/data/bot_persistence
      - ACTIVITY_PATH=/app/data/last_activity.json
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    restart: always
