services:
  bot:
    build: .
    init: true
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/bookclub.db
      - PERSISTENCE_PATH=/app/data/bot_persistence
      - ACTIVITY_PATH=/app/data/last_activity.json
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    restart: always
